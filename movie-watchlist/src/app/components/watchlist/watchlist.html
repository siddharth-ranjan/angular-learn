<div class="watchlist-container">
  <h2>My Watchlist</h2>

  @if (isLoading()) {
    <p class="loading-state">Loading your movies...</p>
  } @else if (displayWatchlist().length > 0) {
    <div class="movie-grid">
      @for (movie of displayWatchlist(); track movie.id) {
        <div class="movie-card" (click)="navigateToMovie(movie.id)">
          <img [src]="movie.poster" [alt]="movie.title">
          <div class="movie-info">
            <h4>{{ movie.title }}</h4>
            <p>{{ movie.year }}</p>
          </div>
        </div>
      }
    </div>
  } @else {
    <p class="empty-state">Your watchlist is empty.</p>
  }
</div>
