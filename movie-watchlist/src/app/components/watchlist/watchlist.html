<div class="watchlist-container">
  <h2>My Watchlist</h2>

  @if (isLoading()) {
    <p class="loading-state">Loading your movies...</p>
  } @else if (watchlistData().length > 0) {
    <div class="movie-grid">
      @for (movie of watchlistData(); track movie.imdbID) {
        <div class="movie-card" (click)="navigateToMovie(movie.imdbID)">
          <img [src]="movie.Poster" [alt]="movie.Title">
          <div class="movie-info">
            <h4>{{ movie.Title }}</h4>
            <p>{{ movie.Year }}</p>
          </div>
        </div>
      }
    </div>
  } @else {
    <p class="empty-state">Your watchlist is empty.</p>
  }
</div>
